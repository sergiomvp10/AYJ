app = "ayj-backend-sergio"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/ayj.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
